name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Check CI test code
        run: npx eslint test/browser-smoke.test.js test/client-leak.test.js test/runAll.js
      - name: Run all suites including required browser smoke test
        shell: bash
        run: |
          export DATA_DIR="$RUNNER_TEMP/tron-ci-data"
          mkdir -p test/artifacts
          set -o pipefail
          npm test 2>&1 | tee test/artifacts/tests.log
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/artifacts/
          if-no-files-found: warn
          retention-days: 7
